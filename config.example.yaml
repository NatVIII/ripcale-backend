# ripcale configuration — copy to config.yaml and adjust.
#
# NOTE: config.yaml is gitignored (keeps your local/secret sources private).
# API keys and other secrets belong in .env, NOT in this file.
#
# The Studio Two Three source below is real, public community data included as
# starter content — copy this file to config.yaml and run `python -m app.ingest`
# to load events immediately.

# Public (read-only) listener.
public_host: 0.0.0.0
public_port: 8081
# Admin (interactive/debug) listener — keep loopback unless you know better.
admin_host: 127.0.0.1
admin_port: 8082

data_dir: data
cors_origins: "*"
# database_url: sqlite:///data/ripcale.db

# Relevance/expiry window (F13): drop incoming events outside this window at
# ingest. expire_past_days drops events that fully ended more than N days ago
# (recurring series only once their last occurrence has passed); null disables.
# expire_future_days drops events starting more than N days ahead (null = no
# future bound).
expire_past_days: 90      # set null to disable the past filter
expire_future_days: null  # or a number to bound the future (e.g. 365)

# Archive grace (F22): an event removed at the source is archived only after
# it has been stale (unseen) this many hours, guarding against transient source
# outages. null = never archive removed-at-source events.
archive_grace_hours: 6

# Display timezone (F28.02): the IANA zone used to render event times in the
# admin UI (storage stays naive-UTC; this is display-only). "UTC" or empty = UTC.
display_timezone: America/New_York

# Ingest scheduler (F11): run the full pipeline every N minutes. null/0 disables.
# Also used as the stale-lock timeout: a held `data/ingest.lock` older than one
# interval is considered dead (a crashed run) and stolen.
ingest_interval_minutes: 60
# Cooldown after admin startup before the scheduler's first ingest.
ingest_startup_delay_minutes: 3

# Debug clock (F56.01): a fixed naive-UTC ISO timestamp (e.g. "2026-12-25T12:00:00").
# When set, the backend's "now" is frozen at that instant (expiry/relevance/archive
# all run "as of" it) and it's served to the frontend via the X-Server-Time header.
# Debug only — empty = real clock.
# debug_now: "2026-12-25T12:00:00"

# Rotating log file (shared by all entrypoints; viewed at /debug/logs).
# Relative paths resolve against data_dir; absolute paths are used as-is.
# log_file: ripcale.log            # default: {data_dir}/ripcale.log
# log_max_bytes: 1000000           # rotate once the file reaches ~1 MB
# log_backup_count: 3              # keep 3 rotated backups (~4 MB max on disk)

# Debug access: comma-separated IPv4 CIDRs allowed to hit the admin endpoints.
# Loopback is always allowed; empty = localhost only. Inside Docker the admin
# app auto-binds 0.0.0.0 and accepts the Docker bridge subnet (172.16.0.0/12),
# since the host publish is loopback-only and the gateway is the only peer.
# debug_allowed_cidrs: "10.0.0.0/8,192.168.1.0/24"
# Optional fixed CSRF token for the pipeline playground (auto-generated if empty).
# debug_token: ""
# Admin login (bootstrap): username + an argon2id password hash.
# Generate the hash with: python -m app.auth hash-password
# admin_username: admin
# admin_password_hash: ""
# Optional pepper: a secret keyed into every password before hashing.
# Generate with: python -m app.auth gen-pepper  (changing it invalidates existing hashes)
# pepper: ""

# Intake settings (sources, per-gatherer defaults, category symlinks) live in a
# SEPARATE file — `intake.yaml` — so the program can edit them (via the admin
# menu) without touching this hand-edited system config. See `intake.example.yaml`.
# Path is configurable via `intake_file` (default: "intake.yaml").
