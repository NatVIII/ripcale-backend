# ripcale intake settings — copy to intake.yaml and adjust.
#
# NOTE: intake.yaml is gitignored (keeps your local/secret sources private).
# This file holds the MUTABLE intake data — sources, per-gatherer defaults, and
# the category system (symlinks + classes) — separate from the system config in
# config.yaml so the program (admin menu, automation) can write it safely.
#
# The Studio Two Three source below is real, public community data included as
# starter content — copy this file to intake.yaml and run `python -m app.ingest`
# to load events immediately.

# Optional: per-gatherer defaults. Higher `priority` = higher priority.
# Applied to every source gathered by that gatherer unless the source overrides it
# below. Extensible with more per-gatherer keys in the future.
gatherers:
  elfsight:
    priority: 5
    # rules:                          # optional — applies to every source of this
    #   - mode: regex                 # gatherer (same CategoryRule shape as sources)
    #     fields: [title]
    #     regex: "(?i)workshop"
    #     categories: [workshop]

sources:
  - name: "Studio Two Three"
    gatherer: "elfsight"
    url: "https://core.service.elfsight.com/p/boot/?page=https%3A%2F%2Fwww.studiotwothree.org%2Fcommunity-events&w=24ddbed9-c732-4102-abd2-02990fae125b"
    is_public: true
    # priority: 8   # optional — overrides the gatherer default (5) above.
                    # Omit to inherit it; falls back to 0 if neither is set.
    rules:                            # categorization heuristics (CATEGORIZE_CONTRACT)
      - mode: assign                  # assign = tag every event unconditionally
        categories: [art]             # (this replaces the old `default_categories`)
      - mode: regex                   # regex = tag when the pattern matches a field
        fields: [title, description]  # string fields to search ([] / "*" = all)
        regex: "(?i)workshop"         # the pattern to match
        categories: [workshop]        # applied when the rule fires
    # default_location: "Richmond, VA"  # optional — fills events with a
                                        # missing/blank location; omit to leave
                                        # such events' location null.

# ---------------------------------------------------------------------------
# Category system
# ---------------------------------------------------------------------------
# Categories are `class:name` identities. The class is a fully dynamic label;
# `intake` is the default class for tags a gatherer introduces, and any other
# class (e.g. `external`) is just a label you use — nothing special in code.
#
#   category_definitions — class -> [names] (class-first).
#       Maps each name to its class. Unlisted names default to `intake`.
#
#   category_symlinks — "class:name" -> "class:name" (read-time).
#       Resolves a raw internal category onto a canonical external one. Both
#       sides are full class:name identities.
#
# Names and classes are slugified to `[a-z0-9-]` at ingest, so write them
# lowercase with dashes.
category_symlinks:
  "intake:visual-arts": "external:art"
  "intake:art-exhibition": "external:art"
  "intake:live-music": "external:music"

category_definitions:
  external:
    - art
    - music
