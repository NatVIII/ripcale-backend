services:
  public:
    build: .
    command: ["python", "-m", "app.public"]
    container_name: ripcale-backend-public
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - ./intake.yaml:/app/intake.yaml
      - ./.env:/app/.env:ro
    restart: unless-stopped

  admin:
    build: .
    command: ["python", "-m", "app.admin"]
    container_name: ripcale-backend-admin
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - ./intake.yaml:/app/intake.yaml
      - ./.env:/app/.env:ro
    restart: unless-stopped
