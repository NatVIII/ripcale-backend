services:
  public:
    build: .
    command: ["python", "-m", "app.public"]
    container_name: ripcale-backend-public
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - ./intake.yaml:/app/intake.yaml
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  admin:
    build: .
    command: ["python", "-m", "app.admin"]
    container_name: ripcale-backend-admin
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - ./intake.yaml:/app/intake.yaml
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
